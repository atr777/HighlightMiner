[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "highlightminer"
version = "0.2.0b1"
description = "Local-first VOD highlight miner: audio + transcript + chat scoring, persistent review history, and clip export."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["vod", "streaming", "highlights", "whisper", "ffmpeg", "twitch", "video"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "numpy>=1.26,<3",
  "psutil>=6,<8",
  "faster-whisper>=1.2.1,<2",
  "streamlit>=1.36,<2",
  "yt-dlp>=2025.1",
  "pywebview>=6.2.1,<7; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]
packaging = [
  "pyinstaller>=6.21,<7",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.scripts]
highlightminer = "highlightminer.cli:main"

[tool.setuptools.packages.find]
include = ["highlightminer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.package-data]
highlightminer = ["preview_component/*.html"]
